# fly.toml app configuration file generated for agenda-autoescola on 2026-11-09T23:13:30-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'agenda-autoescola'
primary_region = 'gru'

[build]
[env]
  DATA_DIR = '/data'
  PORT = '3333'

[[mounts]]
  source = 'agenda_data'
  destination = '/data'

[http_service]
  internal_port = 3333
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
