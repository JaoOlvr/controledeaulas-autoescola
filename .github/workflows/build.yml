name: Build Instaladores

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: run:win
            artifact_name: windows
          - os: ubuntu-latest
            script: run:linux
            artifact_name: linux
          - os: macos-latest
            script: run:mac
            artifact_name: mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Usar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências (compila módulo nativo para a plataforma)
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Compilar o aplicativo
        run: npm run build

      - name: Gerar instalador (${{ matrix.os }})
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enviar artefatos do instalador
        uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error
